<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="bn-title bn-desc">
  <title id="bn-title">TRACKER — Robotics · Embedded · Embodied AI</title>
  <desc id="bn-desc">TRACKER 的个人主页横幅：四连杆轮腿机器人运动学示意图，关键词 Robotics / Embedded / Embodied AI。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060A14"/>
      <stop offset="55%" stop-color="#0A1224"/>
      <stop offset="100%" stop-color="#101C36"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BBD1F0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="linkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9FC2FF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="12" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 9L12 0" fill="none" stroke="#2E4368" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <ellipse cx="1000" cy="146" rx="360" ry="250" fill="url(#glow)"/>

  <path d="M28 60V28H60" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5"/>
  <path d="M1252 240V272H1220" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5"/>

  <rect x="88" y="102" width="5" height="90" rx="2.5" fill="url(#barGrad)"/>

  <text x="114" y="126" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="14.5" letter-spacing="4.2" fill="#5EA9E8">ROBOTICS · EMBEDDED · EMBODIED AI</text>

  <text x="112" y="198" font-family="'Segoe UI Semibold','Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="72" letter-spacing="7" fill="url(#nameFill)">TRACKER</text>

  <text x="114" y="240" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="21" letter-spacing="1.2" fill="#8FA6C6">轮腿机器人 · 嵌入式控制 · 具身智能</text>

  <path d="M114 262H496" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1"/>
  <text x="512" y="266.5" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#4C6690">github.com/track-tech</text>

  <!-- 四连杆轮腿运动学示意 -->
  <g transform="translate(1030 148)" stroke-linecap="round">
    <!-- 地面 -->
    <path d="M-214 118H156" stroke="#38BDF8" stroke-opacity="0.30" stroke-width="2"/>
    <rect x="-214" y="118" width="370" height="9" fill="url(#hatch)" opacity="0.85"/>

    <!-- 跳跃轨迹 -->
    <path d="M34 48Q126 -96 202 -18" fill="none" stroke="#38BDF8" stroke-opacity="0.34" stroke-width="2" stroke-dasharray="7 8"/>
    <circle cx="202" cy="-18" r="5" fill="none" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="202" cy="-18" r="1.8" fill="#38BDF8" fill-opacity="0.7"/>

    <!-- 机体（四连杆的固定杆） -->
    <rect x="-186" y="-84" width="82" height="152" rx="18" fill="#0C1426" stroke="#33507E" stroke-width="2"/>
    <path d="M-168 -30H-124M-168 -8H-124" stroke="#1E3252" stroke-width="3"/>
    <circle cx="-158" cy="-58" r="4" fill="#34D399" fill-opacity="0.85"/>

    <!-- 上、下连杆 -->
    <path d="M-104 -64H-18" stroke="#DCE7F7" stroke-opacity="0.92" stroke-width="9"/>
    <path d="M-104 48H-18" stroke="#DCE7F7" stroke-opacity="0.92" stroke-width="9"/>
    <!-- 连杆（高亮） -->
    <path d="M-18 -64V48" stroke="url(#linkGrad)" stroke-width="10"/>

    <!-- 轮 -->
    <circle cx="-18" cy="84" r="32" fill="none" stroke="#34D399" stroke-opacity="0.9" stroke-width="3"/>
    <path d="M-18 84L-18 52M-18 84L10 100M-18 84L-46 100" stroke="#34D399" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="-18" cy="84" r="7.5" fill="#34D399" fill-opacity="0.95"/>

    <!-- 关节 -->
    <g fill="#0A1224" stroke="#7DD3FC" stroke-width="3">
      <circle cx="-104" cy="-64" r="9"/>
      <circle cx="-104" cy="48" r="9"/>
      <circle cx="-18" cy="-64" r="9"/>
      <circle cx="-18" cy="48" r="9"/>
    </g>
  </g>
</svg>
